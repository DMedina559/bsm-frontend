version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/python"
    target-branch: "dev"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "dep"

  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "daily"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
    commit-message:
      prefix: "dep"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "dep"
