name: Publish frontend distributions

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    if: startsWith(github.event.release.tag_name, 'frontend-')
    uses: ./.github/workflows/build-test.yml

  contract:
    if: startsWith(github.event.release.tag_name, 'frontend-')
    uses: ./.github/workflows/backend-contract.yml
    with:
      backend-ref: pinned

  pypi:
    needs: [validate, contract]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-distributions
      - name: Publish verified Python distribution
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

  npm:
    needs: [validate, contract]
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: frontend-distributions
      - name: Resolve npm frontend release channel
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module - <<'JS'
          import { appendFileSync } from 'node:fs';
          import { resolveReleaseTag } from './scripts/release-version.mjs';
          const release = resolveReleaseTag('frontend', process.env.RELEASE_TAG, process.env.IS_PRERELEASE === 'true');
          appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${release.distTag}\n`);
          JS
      - name: Publish verified npm frontend archive
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        run: npm publish frontend/build/artifacts/*.tgz --access public --provenance --tag "$NPM_DIST_TAG"
