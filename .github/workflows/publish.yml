name: Publish Python distribution

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    if: startsWith(github.event.release.tag_name, 'frontend-')
    uses: ./.github/workflows/build-test.yml

  pypi:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools-scm

      - name: Resolve frontend release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PYTHON'
          import os
          from packaging.version import Version

          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("frontend-"):
              raise ValueError("Frontend release tags must start with frontend-")
          version = Version(tag.removeprefix("frontend-"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PYTHON

      - name: Build package
        run: |
          npm ci
          npm run build:python
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.version }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
