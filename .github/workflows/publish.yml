name: Publish packages

on:
  release:
    types: [published]

permissions:
  contents: read

# Complete one coordinated publication before another release can change channels.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate unified release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module - <<'JS'
          import { resolveRelease } from './scripts/release-version.mjs';
          console.log(resolveRelease(process.env.RELEASE_TAG, process.env.IS_PRERELEASE === 'true'));
          JS

  validate:
    needs: release
    uses: ./.github/workflows/build-test.yml

  lint:
    needs: release
    uses: ./.github/workflows/lint.yml

  # Both registries wait for every check, including browsers and isolated SDK archives.
  pypi:
    needs: [release, validate, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: frontend-distributions
      - name: Publish verified Python distribution
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          skip-existing: true

  npm:
    needs: [release, validate, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install npm for trusted publishing
        run: |
          npm install --global npm@11.21.0
          node --version
          npm --version
          test "$(npm --version)" = '11.21.0'
      - uses: actions/download-artifact@v8
        with:
          name: frontend-distributions
          path: release-artifacts/frontend
      - uses: actions/download-artifact@v8
        with:
          name: shared-packages
          path: release-artifacts/shared
      - name: Publish verified coordinated npm archives
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/publish-npm.mjs release-artifacts
