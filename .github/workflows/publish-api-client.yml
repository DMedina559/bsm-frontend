name: Publish API client

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  npm:
    if: startsWith(github.event.release.tag_name, 'api-client-v')
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm for trusted publishing
        run: npm install --global npm@11.21.0
      - name: Install workspace dependencies
        run: npm ci
      - name: Set SDK version from release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pkg = JSON.parse(readFileSync('packages/api-client/package.json', 'utf8'));
          if (pkg.private) throw new Error('Cannot publish a private package');
          const { resolveReleaseTag } = await import('./scripts/release-version.mjs');
          const { version, distTag } = resolveReleaseTag('api-client', process.env.RELEASE_TAG, process.env.IS_PRERELEASE === 'true');
          const { appendFileSync } = await import('node:fs');
          appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${distTag}\n`);
          execFileSync('npm', [
            'version', version,
            '--workspace=@bedrock-server-manager/api-client',
            '--no-git-tag-version', '--ignore-scripts', '--allow-same-version',
          ], { stdio: 'inherit' });
          const updated = JSON.parse(readFileSync('packages/api-client/package.json', 'utf8'));
          if (updated.version !== version) throw new Error('Release tag must contain a canonical SemVer version');
          JS
      - name: Validate API client
        run: |
          npm run check --workspace=@bedrock-server-manager/api-client
          npm run packages:check -- api-client
      - name: Publish API client
        env:
          NPM_DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        run: npm publish --workspace=@bedrock-server-manager/api-client --access public --provenance --tag "$NPM_DIST_TAG"
