name: Publish API client

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  npm:
    if: startsWith(github.event.release.tag_name, 'api-client-v')
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org
      - name: Install workspace dependencies
        run: npm ci
      - name: Set SDK version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pkg = JSON.parse(readFileSync('packages/api-client/package.json', 'utf8'));
          if (pkg.private) throw new Error('Cannot publish a private package');
          const tag = process.env.RELEASE_TAG;
          const match = /^api-client-v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$/.exec(tag ?? '');
          if (!match) throw new Error('Expected api-client-v<SemVer>, for example api-client-v0.1.1 or api-client-v0.2.0-beta.1');
          const version = match[1];
          execFileSync('npm', [
            'version', version,
            '--workspace=@bedrock-server-manager/api-client',
            '--no-git-tag-version', '--ignore-scripts', '--allow-same-version',
          ], { stdio: 'inherit' });
          const updated = JSON.parse(readFileSync('packages/api-client/package.json', 'utf8'));
          if (updated.version !== version) throw new Error('Release tag must contain a canonical SemVer version');
          JS
      - name: Validate API client
        run: |
          npm run check --workspace=@bedrock-server-manager/api-client
          npm run packages:check -- api-client
      - name: Publish API client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish --workspace=@bedrock-server-manager/api-client --access public --provenance --tag "$NPM_DIST_TAG"
