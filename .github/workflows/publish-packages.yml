name: Publish runtime and storage packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  npm:
    if: startsWith(github.event.release.tag_name, 'runtime-v') || startsWith(github.event.release.tag_name, 'storage-v')
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm for trusted publishing
        run: npm install --global npm@11.21.0
      - name: Install workspace dependencies
        run: npm ci
      - name: Set package version from release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module - <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { resolveReleaseTag } from './scripts/release-version.mjs';
          const tag = process.env.RELEASE_TAG;
          const product = ['runtime', 'storage'].find(name => tag.startsWith(`${name}-v`));
          const { version, distTag } = resolveReleaseTag(product, tag, process.env.IS_PRERELEASE === 'true');
          const workspace = `@bedrock-server-manager/${product}`;
          const path = `packages/${product}/package.json`;
          const pkg = JSON.parse(readFileSync(path, 'utf8'));
          if (pkg.private || pkg.name !== workspace) throw new Error('Unexpected publishable package');
          execFileSync('npm', [
            'version', version, `--workspace=${workspace}`,
            '--no-git-tag-version', '--ignore-scripts', '--allow-same-version',
          ], { stdio: 'inherit' });
          const updated = JSON.parse(readFileSync(path, 'utf8'));
          if (updated.version !== version) throw new Error('Release tag must contain a canonical SemVer version');
          appendFileSync(process.env.GITHUB_OUTPUT, `workspace=${workspace}\npackage=${product}\ndist-tag=${distTag}\n`);
          JS
      - name: Validate package
        env:
          NPM_WORKSPACE: ${{ steps.version.outputs.workspace }}
          PACKAGE_NAME: ${{ steps.version.outputs.package }}
        run: |
          npm run check --workspace="$NPM_WORKSPACE"
          npm run packages:check -- "$PACKAGE_NAME"
      - name: Publish package
        env:
          NPM_WORKSPACE: ${{ steps.version.outputs.workspace }}
          NPM_DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        run: npm publish --workspace="$NPM_WORKSPACE" --access public --provenance --tag "$NPM_DIST_TAG"
