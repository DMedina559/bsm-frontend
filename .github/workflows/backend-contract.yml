name: Backend OpenAPI Contract

on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Backend commit or branch to check
        default: dev
        required: true
        type: string
  schedule:
    - cron: '23 8 * * *'
  push:
    branches-ignore:
      - 'main'
    paths:
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/backend-contract.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: DMedina559/bedrock-server-manager
          ref: ${{ inputs.backend_ref || 'dev' }}
          path: backend-contract
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install backend-owned contract tooling
        run: python -m pip install './backend-contract'
      - name: Compare client contract with backend dev
        run: python -m bedrock_server_manager.web.contract --output /tmp/backend-openapi.json --check frontend/src/api/generated/openapi.json
