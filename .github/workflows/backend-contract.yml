name: Backend OpenAPI Contract

on:
  workflow_call:
    inputs:
      backend-ref:
        description: Backend dev branch or the committed support pin
        type: string
        default: dev
  workflow_dispatch:
    inputs:
      backend-ref:
        description: Backend dev branch or the committed support pin
        type: choice
        options: [dev, pinned]
        default: dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-backend-contract
  cancel-in-progress: true

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Validate backend target
        env:
          BSM_BACKEND_REF: ${{ inputs.backend-ref || 'dev' }}
        run: |
          case "$BSM_BACKEND_REF" in
            dev|pinned) ;;
            *) echo "Backend target must be dev or pinned." >&2; exit 1 ;;
          esac
      - name: Resolve supported backend
        id: backend-source
        run: node scripts/backend-source.mjs
      - uses: actions/checkout@v7
        with:
          repository: DMedina559/bedrock-server-manager
          ref: ${{ inputs.backend-ref == 'pinned' && steps.backend-source.outputs.revision || 'dev' }}
          path: backend-contract
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install backend-owned contract tooling
        run: python -m pip install './backend-contract'
      - name: Compare client contract with target backend
        run: python -m bedrock_server_manager.web.contract --output /tmp/backend-openapi.json --check packages/api-client/src/generated/openapi.json
