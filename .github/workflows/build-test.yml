# .github/workflows/build-test.yml

name: Build Lint Test

on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Backend commit or branch to check for contract drift
        default: a260ed0536946b9ca959f9527d3db8ea4564dcd3
        required: true
        type: string
  push:
    branches-ignore:
      - 'main'
    paths:
      - 'frontend/**'
      - '.github/workflows/build-test.yml'
  #pull_request:
  #  paths:
  #    - 'frontend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Install dependencies and build
      run: |
        cd frontend
        npm ci
        npm run api:check
        npm run typecheck
        npm run build

    - name: Run Frontend Lint
      working-directory: ./frontend
      run: npm run lint

    - name: Run Frontend Tests
      working-directory: ./frontend
      run: npm run test:run

    - name: Install browser
      working-directory: ./frontend
      run: npx playwright install --with-deps chromium

    - name: Run full app browser tests
      working-directory: ./frontend
      run: npm run test:e2e

  backend-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - uses: actions/checkout@v7
      with:
        repository: DMedina559/bedrock-server-manager
        ref: ${{ inputs.backend_ref || 'a260ed0536946b9ca959f9527d3db8ea4564dcd3' }}
        path: backend-contract
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install backend and schema tooling
      run: python -m pip install ./backend-contract fastapi==0.142.4 pydantic==2.14.0
    - name: Export actual registered backend routers and compare
      run: |
        python frontend/scripts/export-openapi.py /tmp/backend-openapi.json
        python frontend/scripts/check-backend-contract.py /tmp/backend-openapi.json
