name: Build and Test

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Resolve frontend release identity
        if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'frontend-')
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module - <<'JS'
          import { appendFileSync } from 'node:fs';
          import { resolveReleaseTag } from './scripts/release-version.mjs';
          const { version } = resolveReleaseTag('frontend', process.env.RELEASE_TAG);
          appendFileSync(process.env.GITHUB_ENV, `SETUPTOOLS_SCM_PRETEND_VERSION=${version}\nBSM_FRONTEND_VERSION=${version}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          JS

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/checkout@v7
        with:
          repository: DMedina559/bedrock-server-manager
          ref: dev
          path: backend
          persist-credentials: false

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install build setuptools-scm -e './backend' -e './python[dev]'

      - name: Build package
        run: |
          npm run build
          node scripts/build-python.mjs

      - name: Run tests
        run: npm test

      - name: Install browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser tests
        run: |
          npm run test:e2e --workspace=bsm-frontend
          npm run test:e2e:backend --workspace=bsm-frontend

      - name: Pack the same verified frontend for npm
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          IS_PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: npm run pack:frontend

      - name: Upload verified frontend distributions
        uses: actions/upload-artifact@v7
        with:
          name: frontend-distributions
          path: |
            frontend/dist/
            frontend/build/artifacts/*.tgz
            python/dist/
          retention-days: 7

  python-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -e './python[dev]'
      - name: Run tests
        run: python -m pytest -c python/pyproject.toml python/tests
