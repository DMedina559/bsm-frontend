name: Build and Test

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set coordinated release versions
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: npm run release:prepare

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install build setuptools-scm -e './python[dev]'

      - name: Build package
        run: |
          npm run build
          node scripts/build-python.mjs

      - name: Run unit tests and archive checks
        run: |
          npm test
          npm run check:archives

      - name: Pack verified frontend for npm
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          IS_PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: npm run pack:frontend

      - name: Pack verified shared packages
        run: |
          mkdir -p build/npm-release
          npm pack --workspace=@bedrock-server-manager/api-client --workspace=@bedrock-server-manager/runtime --workspace=@bedrock-server-manager/storage --pack-destination build/npm-release --ignore-scripts

      - name: Upload verified shared packages
        uses: actions/upload-artifact@v7
        with:
          name: shared-packages
          path: build/npm-release/*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Upload verified frontend distributions
        uses: actions/upload-artifact@v7
        with:
          name: frontend-distributions
          path: |
            frontend/dist/
            frontend/build/artifacts/*.tgz
            python/dist/
          retention-days: 7

  e2e-tests:
    needs: build-and-unit
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout backend integration target
        uses: actions/checkout@v7
        with:
          repository: DMedina559/bedrock-server-manager
          ref: dev
          path: backend
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Allow candidate frontend in backend integration checkout
        run: python scripts/override-backend-frontend-dep.py backend/pyproject.toml

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install build setuptools-scm -e './backend' -e './python[dev]'

      - name: Build frontend and Python assets
        run: |
          npm run build
          node scripts/build-python.mjs

      - name: Install browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser tests
        run: |
          npm run test:e2e --workspace=bsm-frontend
          npm run test:e2e:backend --workspace=bsm-frontend

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-traces
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  python-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e './python[dev]'
      - name: Run tests
        run: python -m pytest -c python/pyproject.toml python/tests
