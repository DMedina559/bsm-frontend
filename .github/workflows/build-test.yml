name: Build Lint Test

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "frontend/**"
      - "packages/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "package*.json"
      - "*config.js"
      - "pyproject.toml"
      - "build.sh"
      - "README.md"
      - "LICENSE"
      - ".pre-commit-config.yaml"
      - ".github/workflows/build-test.yml"
      - ".github/workflows/publish.yml"
  push:
    branches-ignore:
      - 'main'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'build.sh'
      - 'pyproject.toml'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/publish.yml'
      - 'frontend/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - 'prettier.config.js'
      - '.pre-commit-config.yaml'
      - 'scripts/**'
      - '.github/workflows/build-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install dependencies and build
      run: |
        npm ci
        npm run api:check
        npm run typecheck
        npm run build

    - name: Verify package consumers
      run: npm run packages:check

    - name: Run Workspace Lint
      run: npm run lint

    - name: Run Workspace Tests
      run: npm test

    - name: Install browser
      working-directory: ./frontend
      run: npx playwright install --with-deps chromium

    - name: Run full app browser tests
      working-directory: ./frontend
      run: npm run test:e2e

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Validate Python distribution
      run: |
        python -m pip install build setuptools-scm twine pytest
        PYTHONPATH=src python -m pytest
        python -m build
        python -m twine check dist/*
        python -m pip install --force-reinstall dist/*.whl
        python - <<'PYTHON'
        from bsm_frontend import get_static_dir
        static = get_static_dir()
        for asset in ("index.html", "assets/site.webmanifest", "image/panorama.png"):
            assert (static / asset).is_file(), f"Missing packaged frontend asset: {asset}"
        assert list((static / "assets").glob("*.js")), "Missing packaged JavaScript bundles"
        PYTHON
