<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./image/icon/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      href="./image/icon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="shortcut icon" href="./image/icon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./image/icon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bedrock Server Manager</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var appIndex = path.lastIndexOf("/app");
        if (appIndex !== -1) {
          var basePath = path.substring(0, appIndex + 4) + "/";
          document.write('<base href="' + basePath + '" />');
          if (path.endsWith("/app")) {
            window.history.replaceState(
              null,
              "",
              basePath + window.location.search + window.location.hash,
            );
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
