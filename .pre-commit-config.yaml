ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [frontend-eslint]
  submodules: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

      - id: check-added-large-files
        args: ['--maxkb=5120']

  - repo: local
    hooks:
      - id: frontend-prettier
        name: frontend-prettier
        entry: prettier --write
        language: node
        additional_dependencies: [prettier@3.9.10]
        require_serial: true
        files: ^((frontend/|packages/|scripts/).*\.(js|jsx|mjs|ts|tsx|mts|json|css|scss|html|md|yaml|yml)|package(-lock)?\.json|(?:eslint|prettier)\.config\.js)$
        exclude: |
          (?x)^(packages/[^/]+/dist/|frontend/(
            node_modules/|
            dist/|
            build/|
            coverage/
          ))

      - id: frontend-eslint
        name: frontend-eslint
        entry: npm run lint
        language: system
        files: ^((frontend/|packages/).*\.(js|jsx|mjs)|scripts/.*\.mjs|(?:eslint|prettier)\.config\.js)$
        exclude: ^frontend/(node_modules|dist|build|coverage)/
        pass_filenames: false
